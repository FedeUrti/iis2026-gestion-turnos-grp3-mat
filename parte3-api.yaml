openapi: 3.0.3
info:
  title: API UruTurn
  version: 1.0.0
  description: API REST de reservas, establecimientos y personal.
servers:
  - url: http://localhost:8000
tags:
  - name: reservas
  - name: establecimientos
  - name: personal

paths:
  /reservas:
    get:
      tags: [reservas]
      summary: Listar reservas
      parameters:
        - $ref: '#/components/parameters/IdPersonalQuery'
        - $ref: '#/components/parameters/FechaTurno'
        - $ref: '#/components/parameters/EstadoReserva'
      responses:
        '200':
          description: Lista de reservas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reserva' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    post:
      tags: [reservas]
      summary: Solicitar una reserva
      description: Publica la solicitud en MQTT para que el consumidor la procese.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaCreate' }
      responses:
        '202':
          description: Solicitud publicada correctamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitudReserva' }
        '422': { $ref: '#/components/responses/ErrorValidacion' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /reservas/{id_reserva}:
    parameters:
      - $ref: '#/components/parameters/IdReserva'
    get:
      tags: [reservas]
      summary: Obtener una reserva
      responses:
        '200':
          description: Reserva encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [reservas]
      summary: Actualizar una reserva
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaUpdate' }
      responses:
        '200':
          description: Reserva actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
        '409': { $ref: '#/components/responses/Conflicto' }
    delete:
      tags: [reservas]
      summary: Eliminar una reserva
      responses:
        '204': { description: Reserva eliminada }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /establecimientos:
    get:
      tags: [establecimientos]
      summary: Listar establecimientos
      responses:
        '200':
          description: Lista de establecimientos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Establecimiento' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }
    post:
      tags: [establecimientos]
      summary: Crear un nuevo establecimiento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstablecimientoCreate' }
      responses:
        '201':
          description: Establecimiento creado correctamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Establecimiento' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '503': { $ref: '#/components/responses/ServicioNoDisponible' }

  /establecimientos/{id_establecimiento}:
    parameters:
      - $ref: '#/components/parameters/IdEstablecimiento'
    get:
      tags: [establecimientos]
      summary: Obtener un establecimiento
      responses:
        '200':
          description: Establecimiento encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Establecimiento' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [establecimientos]
      summary: Actualizar un establecimiento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstablecimientoUpdate' }
      responses:
        '200':
          description: Establecimiento actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Establecimiento' }
        '400': { $ref: '#/components/responses/ErrorValidacion' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [establecimientos]
      summary: Eliminar un establecimiento
      responses:
        '204': { description: Establecimiento eliminado }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /personal:
    get:
      tags: [personal]
      summary: Listar personal
      parameters:
        - name: id_establecimiento
          in: query
          schema: { type: integer }
        - name: cargo
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista de miembros del personal
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Personal' }
    post:
      tags: [personal]
      summary: Crear miembro del personal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalCreate' }
      responses:
        '201':
          description: Creado exitosamente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Personal' }

  /personal/{id_personal}:
    parameters:
      - name: id_personal
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [personal]
      summary: Obtener personal
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Personal' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [personal]
      summary: Actualizar personal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalUpdate' }
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Personal' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [personal]
      summary: Eliminar personal
      responses:
        '204': { description: Eliminado }
        '404': { $ref: '#/components/responses/NoEncontrado' }

components:
  parameters:
    IdReserva:
      name: id_reserva
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    IdPersonalQuery:
      name: id_personal
      in: query
      schema: { type: integer, minimum: 1 }
    FechaTurno:
      name: fecha_turno
      in: query
      schema: { type: string, format: date }
    EstadoReserva:
      name: estado_reserva
      in: query
      schema: { $ref: '#/components/schemas/EstadoReserva' }
    IdEstablecimiento:
      name: id_establecimiento
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  schemas:
    ReservaCreate:
      type: object
      required: [email_solicitante, telefono_solicitante, id_personal, fecha_turno, hora_turno]
      properties:
        email_solicitante: { type: string, format: email, example: paciente@correo.com }
        telefono_solicitante: { type: string, minLength: 6, example: '099123456' }
        id_personal: { type: integer, minimum: 1, example: 1 }
        fecha_turno: { type: string, format: date, example: '2026-10-01' }
        hora_turno: { type: string, format: time, example: '10:00:00' }

    ReservaUpdate:
      type: object
      additionalProperties: false
      properties:
        email_solicitante: { type: string, format: email }
        telefono_solicitante: { type: string, minLength: 6, maxLength: 50 }
        id_personal: { type: integer, minimum: 1 }
        fecha_turno: { type: string, format: date }
        hora_turno: { type: string, format: time }
        estado_reserva: { $ref: '#/components/schemas/EstadoReserva' }

    Reserva:
      allOf:
        - $ref: '#/components/schemas/ReservaCreate'
        - type: object
          required: [id_reserva, fecha_reservado, estado_reserva]
          properties:
            id_reserva: { type: integer, example: 1 }
            fecha_reservado: { type: string, format: date-time }
            estado_reserva: { $ref: '#/components/schemas/EstadoReserva' }

    EstadoReserva:
      type: string
      enum: [RESERVADO, CANCELADO, FINALIZADO]

    SolicitudReserva:
      type: object
      required: [mensaje, turno]
      properties:
        mensaje: { type: string, example: Solicitud publicada; el consumidor la procesará }
        turno: { $ref: '#/components/schemas/TurnoPublicado' }

    TurnoPublicado:
      allOf:
        - $ref: '#/components/schemas/ReservaCreate'
        - type: object
          required: [id]
          properties:
            id: { type: integer, minimum: 100000, maximum: 999999, example: 482731 }

    EstablecimientoCreate:
      type: object
      required: [nombre_comercial, direccion, telefono, correo_electronico, horario_apertura, horario_cierre]
      properties:
        nombre_comercial: { type: string, maxLength: 150, example: "Clínica Central" }
        direccion: { type: string, maxLength: 255, example: "Av. Brasil 2530" }
        telefono: { type: string, maxLength: 50, example: "099123456" }
        correo_electronico: { type: string, format: email, maxLength: 100, example: "contacto@clinicacentral.com" }
        horario_apertura: { type: string, format: time, example: "08:00:00" }
        horario_cierre: { type: string, format: time, example: "20:00:00" }

    EstablecimientoUpdate:
      type: object
      additionalProperties: false
      properties:
        nombre_comercial: { type: string, maxLength: 150 }
        direccion: { type: string, maxLength: 255 }
        telefono: { type: string, maxLength: 50 }
        correo_electronico: { type: string, format: email, maxLength: 100 }
        horario_apertura: { type: string, format: time }
        horario_cierre: { type: string, format: time }

    Establecimiento:
      allOf:
        - $ref: '#/components/schemas/EstablecimientoCreate'
        - type: object
          required: [id_establecimiento]
          properties:
            id_establecimiento: { type: integer, example: 1 }

    PersonalCreate:
      type: object
      required: [nombre, apellido, email, telefono, cargo, id_establecimiento]
      properties:
        nombre: { type: string, example: "Juan" }
        apellido: { type: string, example: "Pérez" }
        email: { type: string, format: email, example: "juan.perez@email.com" }
        telefono: { type: string, example: "099111222" }
        cargo: { type: string, example: "Doctor" }
        id_establecimiento: { type: integer, example: 1 }

    PersonalUpdate:
      type: object
      additionalProperties: false
      properties:
        nombre: { type: string }
        apellido: { type: string }
        email: { type: string, format: email }
        telefono: { type: string }
        cargo: { type: string }
        id_establecimiento: { type: integer }

    Personal:
      allOf:
        - $ref: '#/components/schemas/PersonalCreate'
        - type: object
          required: [id_personal]
          properties:
            id_personal: { type: integer, example: 1 }

    Error:
      type: object
      properties:
        detail: { type: string }

  responses:
    ErrorValidacion:
      description: Datos de entrada inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoEncontrado:
      description: Recurso no encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflicto:
      description: La operación viola una regla de negocio
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServicioNoDisponible:
      description: Base de datos o broker no disponible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }