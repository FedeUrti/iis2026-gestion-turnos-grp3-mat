services:
  # Broker MQTT (Eclipse Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: uruturn_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: uruturn_db
      MYSQL_USER: uruturn_user
      MYSQL_PASSWORD: uruturn_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -proot_password"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Interfaz web para administrar MySQL
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: uruturn_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8080:80"
    volumes:
      - phpmyadmin_data:/sessions
    depends_on:
      db:
        condition: service_healthy

  # Servicio Generador de Turnos (Python)
  generador:
    build:
      context: ./scripts/generador
      dockerfile: DockerFile
    container_name: generador_turnos
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: turnos/solicitudes
    depends_on:
      - mosquitto

  # Servicio Consumidor de Turnos (Python)
  consumidor:
    build:
      context: ./scripts/consumidor
      dockerfile: DockerFile
    container_name: consumidor_turnos
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: turnos/solicitudes
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: uruturn_db
      DB_USER: uruturn_user
      DB_PASSWORD: uruturn_password
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

  # API REST de Reservas
  reservas-api:
    build:
      context: ./servicios/reservas
      dockerfile: Dockerfile
    container_name: reservas_api
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: turnos/solicitudes
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: uruturn_db
      DB_USER: uruturn_user
      DB_PASSWORD: uruturn_password
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  mosquitto_data:
  mosquitto_log:
  mysql_data:
  phpmyadmin_data: