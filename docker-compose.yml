services:
  # Broker MQTT (Eclipse Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: uruturn_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: uruturn_db
      POSTGRES_USER: uruturn_user
      POSTGRES_PASSWORD: uruturn_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uruturn_user -d uruturn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio Generador de Turnos (Python)
  generador:
    build:
      context: ./scripts/generador
      dockerfile: DockerFile
    container_name: generador_turnos
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: turnos/solicitudes
    depends_on:
      - mosquitto

  # Servicio Consumidor de Turnos (Python)
  consumidor:
    build:
      context: ./scripts/consumidor
      dockerfile: DockerFile
    container_name: consumidor_turnos
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_TOPIC: turnos/solicitudes
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: uruturn_db
      DB_USER: uruturn_user
      DB_PASSWORD: uruturn_password
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started

volumes:
  mosquitto_data:
  mosquitto_log:
  postgres_data: